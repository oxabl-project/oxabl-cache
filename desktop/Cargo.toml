[workspace]
resolver = "3"
members = ["."]

[package]
name = "oxabl-cache-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/oxabl-project/oxabl-cache"
description = "A small desktop window onto your organisation's oxabl caches: size, speed, hit rate, and joining one."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxabl-cache-desktop"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
oxabl-cache-client = { path = "../crates/oxabl-cache-client" }
oxabl-cache-format = { path = "../crates/oxabl-cache-format" }
rune = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "7ead7d63fcf6f9dd9669385a8b90e2ae80015d7b" }
wgpu = { version = "~30.0.1", default-features = false }
getrandom = "0.4"
base64 = "0.22"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
url = "2"

[dev-dependencies]
oxabl-cache-e2e = { path = "../tests/e2e" }
serde_json = "1"

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
