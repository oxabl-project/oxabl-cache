[workspace]
resolver = "3"
members = ["crates/*", "tests/e2e"]
exclude = ["scripts/gate-fixture"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/oxabl-project/oxabl-cache"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
oxabl-cache-format = { path = "crates/oxabl-cache-format" }
oxabl-cache-crypto = { path = "crates/oxabl-cache-crypto" }
oxabl-cache-client = { path = "crates/oxabl-cache-client" }
oxabl-cache-core = { path = "crates/oxabl-cache-core" }
oxabl-cache-meta-sqlite = { path = "crates/oxabl-cache-meta-sqlite" }
oxabl-cache-meta-postgres = { path = "crates/oxabl-cache-meta-postgres" }
oxabl-cache-store-fs = { path = "crates/oxabl-cache-store-fs" }
oxabl-cache-store-s3 = { path = "crates/oxabl-cache-store-s3" }
oxabl-cache-oidc = { path = "crates/oxabl-cache-oidc" }
oxabl-cache-http = { path = "crates/oxabl-cache-http" }
oxabl-cache-e2e = { path = "tests/e2e" }

age = { version = "0.12", default-features = false }
anyhow = "1"
aws-lc-rs = "1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
blake3 = "1"
clap = { version = "4", default-features = false }
bytes = "1"
ed25519-dalek = { version = "3", default-features = false }
getrandom = "0.4"
hmac = "0.13"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
jiff = { version = "0.2", default-features = false }
rcgen = { version = "0.14", default-features = false }
rusqlite = "0.41"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.11"
subtle = "2"
nix = { version = "0.31", default-features = false }
reqwest = { version = "0.13", default-features = false }
rusty-s3 = "0.11"
tokio = "1"
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26", default-features = false }
toml = "0.9"
url = "2"
futures-util = { version = "0.3", default-features = false }
zeroize = "1"
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
