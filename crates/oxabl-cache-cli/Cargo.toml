[package]
name = "oxabl-cache-cli"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The oxabl-cache member command line: identities, roster, rotation, login."

[[bin]]
name = "oxabl-cache"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
oxabl-cache-client.workspace = true
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "env"] }
getrandom.workspace = true
nix = { workspace = true, features = ["term"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
oxabl-cache-e2e.workspace = true
blake3.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
