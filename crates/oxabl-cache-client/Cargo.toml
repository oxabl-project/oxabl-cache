serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true
zstd.workspace = true

[dev-dependencies]
oxabl-cache-e2e = { path = "../../tests/e2e" }
