[package]
name = "oxabl-cache-client"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client library for the oxabl-cache end-to-end encrypted remote compile cache."
readme = "README.md"
keywords = ["oxabl", "abl", "cache", "build"]
categories = ["development-tools::build-utils"]
exclude = ["tests/", "examples/"]

[lints]
workspace = true

[dependencies]
oxabl-cache-crypto = { path = "../oxabl-cache-crypto", version = "0.2.0" }
oxabl-cache-format = { path = "../oxabl-cache-format", version = "0.2.0" }
base64.workspace = true
bytes.workspace = true
blake3.workspace = true
cap-std.workspace = true
futures-core.workspace = true
getrandom.workspace = true
nix = { workspace = true, features = ["fs"] }
reqwest = { workspace = true, features = ["form", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true
zstd.workspace = true
keyring-core = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }

[features]
default = ["os-keyring"]
## Reads and stores the identity passphrase in the operating system's keyring (the Secret
## Service on Linux).
os-keyring = ["dep:keyring-core", "dep:zbus-secret-service-keyring-store"]

[dev-dependencies]
oxabl-cache-e2e = { path = "../../tests/e2e" }
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
nix = { workspace = true, features = ["resource"] }
