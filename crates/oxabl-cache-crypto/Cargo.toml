[package]
name = "oxabl-cache-crypto"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Client-side cryptography for the oxabl-cache remote compile cache: key hierarchy, seal and open, signatures."
readme = "README.md"
keywords = ["oxabl", "abl", "cache", "encryption"]
categories = ["development-tools::build-utils"]
exclude = ["tests/", "examples/"]

[lints]
workspace = true

[dependencies]
oxabl-cache-format = { path = "../oxabl-cache-format", version = "0.3.0" }
age.workspace = true
aws-lc-rs.workspace = true
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
subtle.workspace = true
zeroize = { workspace = true, features = ["derive"] }
zstd.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["resource"] }
