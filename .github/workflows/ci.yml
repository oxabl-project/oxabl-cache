name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: nix develop --command rustup toolchain install
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Allow unprivileged user namespaces for the OIDC tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        run: nix develop --command cargo test --workspace --locked

  under-load:
    name: Client behaviour on one busy CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            target
          key: load-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: load-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: nix develop --command rustup toolchain install
      - name: Allow unprivileged user namespaces for the OIDC tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Behaviour suite on CPU 0 beside four busy loops
        run: nix develop --command scripts/test-under-load.sh 4

  dependency-gate:
    name: Server dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
          key: gate-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock', 'scripts/gate-fixture/Cargo.lock') }}
          restore-keys: gate-${{ runner.os }}-
      - name: Install the pinned toolchain
        run: nix develop --command rustup toolchain install
      - name: The server tree holds no client-side crate
        run: nix develop --command scripts/check-server-deps.sh
      - name: The gate rejects the fixture that does
        run: nix develop --command scripts/check-gate-fixture.sh
      - name: release-please can read the workspace
        run: nix develop --command scripts/check-release-graph.sh

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: fuzz-${{ runner.os }}-
      - name: Install the nightly toolchain
        run: nix develop --command rustup toolchain install nightly --profile minimal
      - name: Run every fuzz target for 30 seconds
        run: fuzz/run.sh 30

  deploy-artifacts:
    name: Deploy artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Helm chart, OpenTofu module and systemd units
        run: nix develop --command deploy/check.sh
