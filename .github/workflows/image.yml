name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deploy/container/**"
      - "deploy/lib/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/image.yml"

env:
  IMAGE: ghcr.io/oxabl-project/oxabl-cache-server

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Source date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: ${{ matrix.platform }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          load: true
          tags: oxabl-cache-server:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.suffix }},mode=max
      - name: Smoke test
        run: deploy/container/smoke.sh oxabl-cache-server:smoke
      - uses: cachix/install-nix-action@v31
        if: matrix.suffix == 'amd64'
      - name: Two nodes on Postgres and S3
        if: matrix.suffix == 'amd64'
        run: nix develop --command deploy/container/cluster-smoke.sh oxabl-cache-server:smoke
      - name: Log in to the registry
        if: github.event_name != 'pull_request' && vars.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request' && vars.PUBLISH_IMAGE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/container/Containerfile
          platforms: ${{ matrix.platform }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.suffix }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
      - name: Export the digest
        if: github.event_name != 'pull_request' && vars.PUBLISH_IMAGE == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload the digest
        if: github.event_name != 'pull_request' && vars.PUBLISH_IMAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and sign
    if: github.event_name != 'pull_request' && vars.PUBLISH_IMAGE == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Resolve the digest
        id: digest
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)"
          [ -n "$digest" ] && [ "$digest" != null ] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.digest }}"
