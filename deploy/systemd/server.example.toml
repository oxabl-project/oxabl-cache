# Single binary behind a local proxy (Caddy) that terminates TLS and forwards to 127.0.0.1:8443.
# For built-in TLS see docs/hosting/deploy-container.md ("TLS").

[server]
listen = "127.0.0.1:8443"
public_url = "https://cache.example.com"

[metadata]
url = "sqlite:///var/lib/oxabl-cache/meta.db"

[store]
kind = "fs"
root = "/var/lib/oxabl-cache/objects"

[keys]
url_key_file = "/run/credentials/oxabl-cache.service/url-key"
claim_hash_key_file = "/run/credentials/oxabl-cache.service/claim-key"

[log]
level = "info"
format = "json"
