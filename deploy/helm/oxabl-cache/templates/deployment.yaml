{{- $single := eq .Values.mode "single-node" -}}
{{- $secrets := "/run/secrets/oxabl-cache" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxabl-cache.fullname" . }}
  labels:
    {{- include "oxabl-cache.labels" . | nindent 4 }}
spec:
  {{- if not (and (not $single) .Values.autoscaling.enabled) }}
  replicas: {{ include "oxabl-cache.replicas" . }}
  {{- end }}
  {{- if $single }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  selector:
    matchLabels:
      {{- include "oxabl-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "oxabl-cache.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oxabl-cache.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oxabl-cache
          image: {{ include "oxabl-cache.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/oxabl-cache/server.toml
            - serve
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 9091
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/oxabl-cache
              readOnly: true
            - name: secrets
              mountPath: {{ $secrets }}
              readOnly: true
            {{- if $single }}
            - name: data
              mountPath: /var/lib/oxabl-cache
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "oxabl-cache.fullname" . }}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.keys.existingSecret }}
                  items:
                    - key: {{ .Values.keys.urlKeyKey }}
                      path: url-key
                    - key: {{ .Values.keys.claimKeyKey }}
                      path: claim-key
              {{- if eq .Values.tls.mode "secret" }}
              - secret:
                  name: {{ .Values.tls.existingSecret }}
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              {{- end }}
              {{- if not $single }}
              - secret:
                  name: {{ .Values.metadata.postgres.passwordSecret.name }}
                  items:
                    - key: {{ .Values.metadata.postgres.passwordSecret.key }}
                      path: db-password
              - secret:
                  name: {{ .Values.store.s3.credentialsSecret.name }}
                  items:
                    - key: {{ .Values.store.s3.credentialsSecret.accessKeyIdKey }}
                      path: s3-access-key-id
                    - key: {{ .Values.store.s3.credentialsSecret.secretAccessKeyKey }}
                      path: s3-secret-access-key
              {{- end }}
        {{- if $single }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "oxabl-cache.fullname" .) .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if not $single }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "oxabl-cache.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- end }}
