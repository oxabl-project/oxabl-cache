[package]
name = "oxabl-cache-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "cargo-fuzz targets for oxabl-cache-format and oxabl-cache-crypto."

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1"
blake3 = "1"
libfuzzer-sys = "0.4"
oxabl-cache-crypto = { path = "../crates/oxabl-cache-crypto" }
oxabl-cache-format = { path = "../crates/oxabl-cache-format" }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "lookup_request"
path = "fuzz_targets/lookup_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lookup_response"
path = "fuzz_targets/lookup_response.rs"
test = false
doc = false
bench = false

